<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtGrid — tabla declarativa para React y Angular</title>
    <meta
      name="description"
      content="AtGrid: data grid declarativo con orden multi-columna, filtros tipados, agrupación con subtotales, export a Excel sin librerías y persistencia de estado. Para React 18 y Angular 18/19."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&family=Spline+Sans+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes del primer paint para evitar flash
      ;(function () {
        var saved = localStorage.getItem('atgrid-site-theme')
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
